name: Terraform PR

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform-pr.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: ${{ matrix.stack }} (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [access, foundation, serverless, frontend]
        env: [dev, prd]
    # gives the job the environment's variables (WIF_PROVIDER, DEPLOYER_SA)
    environment: ${{ matrix.env }}
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -diff

      - name: Init
        run: terraform init -input=false -backend-config=backends/${{ matrix.env }}.hcl

      - name: Validate
        run: terraform validate

      # -lock=false : un plan en PR ne modifie rien, il ne doit pas bloquer un apply en cours
      - name: Plan
        run: terraform plan -input=false -lock=false -var-file=${{ matrix.env }}.tfvars
