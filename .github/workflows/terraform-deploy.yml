   name: Terraform Deploy

   on:
     push:
       tags: ['v*']

   permissions:
     contents: read
     id-token: write

   concurrency:
     group: terraform-deploy
     cancel-in-progress: false

   jobs:
     deploy:
       runs-on: ubuntu-latest
       strategy:
         max-parallel: 1
         matrix:
           env: [dev, prd]
       environment: ${{ matrix.env }}
       defaults:
         run:
           working-directory: infra/foundation
       steps:
         - uses: actions/checkout@v4
         - uses: hashicorp/setup-terraform@v3
         - uses: google-github-actions/auth@v2
           with:
             workload_identity_provider: ${{ vars.WIF_PROVIDER }}
             service_account: ${{ vars.DEPLOYER_SA }}
         - run: terraform init -input=false -backend-config=backends/${{ matrix.env }}.hcl
         - run: terraform apply -input=false -auto-approve -var-file=${{ matrix.env }}.tfvars